services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: routely
      POSTGRES_PASSWORD: routely
      POSTGRES_DB: routely
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./data/seed.sql:/docker-entrypoint-initdb.d/seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U routely"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://routely:routely@db:5432/routely
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      USE_MOCK_LLM: ${USE_MOCK_LLM:-1}
      DEM_PATH: /data/dem.tif
      BUILDINGS_PATH: /data/buildings.gpkg
    volumes:
      - ./data:/data
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
