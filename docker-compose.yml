# Общая для всех сервисов платформа: на Apple Silicon без неё postgis и GDAL
# подтягиваются под arm64 и расходятся с гео-библиотеками backend.
x-platform: &default-platform linux/amd64

# Конфигурация читается из .env одного корневого файла. `required: false`
# оставляет запуск без копирования шаблона рабочим: значения ниже всё равно
# имеют дефолты.
x-env-file: &default-env-file
  - path: .env
    required: false

services:
  db:
    image: postgis/postgis:16-3.4
    platform: *default-platform
    restart: unless-stopped
    env_file: *default-env-file
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-routely}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-routely}
      POSTGRES_DB: ${POSTGRES_DB:-routely}
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./data/seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-routely} -d ${POSTGRES_DB:-routely}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    platform: *default-platform
    restart: unless-stopped
    env_file: *default-env-file
    expose:
      - "8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://routely:routely@db:5432/routely}
      LLM_API_KEY: ${LLM_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.aitunnel.ru/v1}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      USE_MOCK_LLM: ${USE_MOCK_LLM:-1}
      DEM_PATH: ${DEM_PATH:-/data/dem.tif}
      BUILDINGS_PATH: ${BUILDINGS_PATH:-/data/buildings.gpkg}
      NOISE_PATH: ${NOISE_PATH:-/data/noise_sources.geojson}
      BEACHES_PATH: ${BEACHES_PATH:-/data/beaches.geojson}
      HOTELS_PATH: ${HOTELS_PATH:-/data/hotels.geojson}
    volumes:
      - ./data:/data:ro
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request,sys; sys.exit(0 if urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=3).status == 200 else 1)
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    platform: *default-platform
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---- Одноразовые задачи: docker compose --profile tools run --rm <service> ----
  seed:
    profiles: ["tools"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    platform: *default-platform
    environment:
      USE_MOCK_LLM: "1"
      DEM_PATH: /data/dem.tif
      BUILDINGS_PATH: /data/buildings.gpkg
      NOISE_PATH: /data/noise_sources.geojson
      BEACHES_PATH: /data/beaches.geojson
      HOTELS_PATH: /data/hotels.geojson
      GUIDES_PATH: /data/guides
      GUIDES_API_URL: ${GUIDES_API_URL:-}
      GUIDES_API_TOKEN: ${GUIDES_API_TOKEN:-}
      GUIDES_CITY: ${GUIDES_CITY:-}
      GROUND_TRUTH: /data/ground_truth.csv
      EVAL_REPORT: /data/eval_report.json
      # Внутри сети compose адрес фиксирован: localhost здесь — это сам
      # контейнер, а не опубликованный порт UI.
      ROUTELY_API: http://backend:8000
    volumes:
      - ./data:/data
      - ./scripts:/scripts:ro
    command: ["python", "/scripts/fetch_data.py"]

  test:
    profiles: ["tools"]
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    platform: *default-platform
    environment:
      USE_MOCK_LLM: "1"
      DEM_PATH: /data/dem.tif
      BUILDINGS_PATH: /data/buildings.gpkg
      NOISE_PATH: /data/noise_sources.geojson
      BEACHES_PATH: /data/beaches.geojson
      HOTELS_PATH: /data/hotels.geojson
    volumes:
      - ./data:/data:ro

volumes:
  pgdata:
