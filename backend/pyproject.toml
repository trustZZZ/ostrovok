[project]
name = "routely-ostrovok"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg",
    "geoalchemy2",
    "pydantic>=2.0",
    "pydantic-settings",
    "pyyaml",
    "langgraph>=0.2",
    # Состояние прогонов агента переживает рестарт контейнера: MemorySaver
    # жил в памяти процесса, и незавершённый прогон терялся вместе с thread_id.
    "langgraph-checkpoint-postgres>=3.2",
    # psycopg нужен checkpointer'у; бинарная сборка приносит libpq, которой
    # нет в slim-образе (иначе «libpq library not found»).
    "psycopg[binary]>=3.1",
    "langchain-openai",
    "httpx",
    "geopandas",
    "shapely>=2.0",
    "rasterio",
    "osmnx",
    "pysolar",
    # pyosmium: сбор данных (scripts/fetch_data.py) читает OSM PBF, потому что
    # shapefile Geofabrik не содержит building:levels и height. Нужен образу,
    # из которого запускается seed-контейнер.
    "osmium>=3.6",
    "numpy",
    "openai",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
]

[tool.pytest.ini_options]
# Тесты лежат только здесь. Раньше набор отсутствовал вовсе, и `make test`
# падал с кодом 5 («no tests ran») — цель в Makefile выглядела рабочей,
# но ничего не проверяла.
testpaths = ["tests"]
pythonpath = ["."]
