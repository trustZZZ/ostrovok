[project]
name = "routely-ostrovok"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg",
    "geoalchemy2",
    "pydantic>=2.0",
    "pydantic-settings",
    "pyyaml",
    "langgraph>=0.2",
    "langchain-openai",
    "httpx",
    "geopandas",
    "shapely>=2.0",
    "rasterio",
    "osmnx",
    "pysolar",
    # pyosmium: сбор данных (scripts/fetch_data.py) читает OSM PBF, потому что
    # shapefile Geofabrik не содержит building:levels и height. Нужен образу,
    # из которого запускается seed-контейнер.
    "osmium>=3.6",
    "numpy",
    "openai",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
]
