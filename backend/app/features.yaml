# Реестр характеристик отелей.
#
# ЭТО ЕДИНСТВЕННОЕ МЕСТО, куда нужно добавить запись, чтобы система начала
# собирать новую характеристику:
#   - tools       — имена инструментов из app/collectors.py (пусто = только отельер)
#   - question    — что спросить у отельера, если инструменты не дали уверенности
#   - value_field — какое поле значения сравнивать при поиске
#   - search      — как интерпретировать пожелание пользователя
#
# Граф и поиск читают этот файл при старте и не содержат списка характеристик
# в коде, поэтому добавление фичи не требует правки Python.

version: 1

features:
  sunset_view:
    title: "Вид на закат"
    description: >-
      Открытый вид в западную часть горизонта в сторону заката.
      Считается по рельефу (SRTM) и высотам зданий (OSM) вдоль луча до 10 км.
    target: hotel
    value_type: boolean
    value_field: visible
    ttl_days: 365
    min_confidence: 0.5
    tools: [sunset_view]
    question: >-
      Какие номера выходят на запад? На каком они этаже и что видно из их окон —
      море, открытый горизонт или соседние здания?
    search:
      op: "=="
      hint: "вид на закат, западная сторона, закат из окна"

  noise_score:
    title: "Уровень шума"
    description: >-
      Оценка шума 0–100 по дорогам, железной дороге и ночным заведениям
      в радиусе 100–300 м. Чем меньше, тем тише.
    target: hotel
    value_type: number
    value_field: score
    ttl_days: 180
    min_confidence: 0.5
    tools: [noise_score]
    question: >-
      Есть ли в номерах шумоизоляция? Какие номера выходят на дорогу,
      а какие во двор?
    search:
      op: "<="
      hint: "тихий номер, тишина, чтобы не мешал шум, спокойный район"
      # Шума 0/100 не бывает: такой порог отсекает все отели подряд.
      min: 10
      max: 100

  walk_to_sea:
    title: "Пешком до моря"
    description: >-
      Время пешего пути до пляжа по реальным дорогам OSM с учётом рельефа,
      а не по прямой. Отдельно отмечается переход через магистраль.
    target: hotel
    value_type: number
    value_field: minutes
    ttl_days: 365
    min_confidence: 0.5
    tools: [walk_to_sea]
    question: >-
      Сколько минут пешком от вас до пляжа и нужно ли переходить дорогу
      с интенсивным движением?
    search:
      op: "<="
      hint: "рядом с морем, близко к пляжу, пешком до моря"
      min: 1
      max: 180

  climate_summer:
    title: "Климат летом"
    description: >-
      Средний суточный максимум температуры в июле по историческим данным
      Open-Meteo за 2019–2024 годы.
    target: hotel
    value_type: number
    value_field: mean_july_max_c
    ttl_days: 30
    min_confidence: 0.7
    tools: [climate_summer]
    question: ""
    search:
      op: ">="
      hint: "тёплое море, тепло, купаться, жарко"
      min: 5
      max: 45

  pet_friendly:
    title: "Можно с питомцем"
    description: >-
      Пускают ли с животными и на каких условиях. Из открытых данных не
      выводится — узнаём только у отельера.
    target: hotel
    value_type: boolean
    value_field: allowed
    ttl_days: 180
    min_confidence: 0.5
    tools: []
    question: >-
      Пускаете ли вы гостей с животными? Каких животных и до какого веса,
      есть ли доплата?
    search:
      op: "=="
      hint: "с собакой, с питомцем, с кошкой"

  # --- Характеристики уровня номера ---------------------------------------
  # Из открытых данных не выводятся: какие номера выходят на запад или
  # насколько тихие окна, знает только отельер. Поэтому tools пуст и агент
  # всегда формулирует вопрос. Значение хранится вместе с категорией номера,
  # чтобы ответ «только люкс на 5 этаже» не превращался в «во всех номерах».
  room_west_windows:
    title: "Номера на запад"
    description: >-
      В каких категориях номеров окна выходят на запад — то есть откуда
      реально виден закат, а не только из коридора.
    target: room
    value_type: boolean
    value_field: west_windows
    ttl_days: 180
    min_confidence: 0.5
    tools: []
    question: >-
      Какие категории номеров выходят окнами на запад? На каком этаже они
      находятся и что видно из окон?
    search:
      op: "=="
      hint: "номер с видом на закат, западная сторона номера"

  room_silence:
    title: "Тихие номера"
    description: >-
      Есть ли в номерах шумоизоляция и какие категории выходят во двор,
      а не на дорогу.
    target: room
    value_type: boolean
    value_field: soundproof
    ttl_days: 180
    min_confidence: 0.5
    tools: []
    question: >-
      Есть ли в номерах шумоизоляция? Какие категории выходят окнами во двор,
      а какие — на дорогу?
    search:
      op: "=="
      hint: "тихий номер, шумоизоляция, не слышно улицы"

  room_balcony:
    title: "Номер с балконом"
    description: >-
      В каких категориях номеров есть балкон или терраса.
    target: room
    value_type: boolean
    value_field: balcony
    ttl_days: 180
    min_confidence: 0.5
    tools: []
    question: >-
      В каких категориях номеров есть балкон или терраса?
    search:
      op: "=="
      hint: "номер с балконом, терраса, открытая площадка"

  # --- Партнёрский источник: «эмоции» от мест рядом с отелем --------------
  # Значение собирается не инструментом и не отельером, а ingest-ом
  # партнёрских обзоров (scripts/ingest_guides.py): место, где встречают
  # закат, привязывается к отелям пешим маршрутом. Поэтому tools и question
  # пусты — агенту нечего собирать и не о чем спрашивать, факт приходит
  # извне и уже содержит цитаты обзоров.
  #
  # authoritative: blogger — при расхождении с расчётом верим обзорам:
  # «отсюда видно закат» геометрией не проверяется, а цитата и ссылка
  # на первоисточник проверяются.
  sunset_spot_nearby:
    title: "Закатная точка рядом"
    description: >-
      Место в пешей доступности, где встречают закат. Подтверждено обзорами
      партнёрских гидов и привязано к пешему маршруту. score 0–1 — насколько
      обзоры связывают это место именно с закатом, а не с чем-то ещё.
    target: hotel
    value_type: number
    value_field: score
    ttl_days: 180
    min_confidence: 0.5
    tools: []
    question: ""
    authoritative: blogger
    search:
      op: ">="
      hint: >-
        встретить закат на берегу, закат у моря, смотровая площадка,
        закатная точка, где смотреть закат
      # Порог ниже 0.5 пропускает места, где закат упомянут вскользь:
      # гость просил закат, а не «кафе с видом на что-нибудь».
      min: 0.5
      max: 1.0
