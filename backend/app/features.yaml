# Реестр характеристик отелей.
#
# ЭТО ЕДИНСТВЕННОЕ МЕСТО, куда нужно добавить запись, чтобы система начала
# собирать новую характеристику:
#   - tools       — имена инструментов из app/collectors.py (пусто = только отельер)
#   - question    — что спросить у отельера, если инструменты не дали уверенности
#   - value_field — какое поле значения сравнивать при поиске
#   - search      — как интерпретировать пожелание пользователя
#
# Граф и поиск читают этот файл при старте и не содержат списка характеристик
# в коде, поэтому добавление фичи не требует правки Python.

version: 1

features:
  sunset_view:
    title: "Вид на закат"
    description: >-
      Открытый вид в западную часть горизонта в сторону заката.
      Считается по рельефу (SRTM) и высотам зданий (OSM) вдоль луча до 10 км.
    target: hotel
    value_type: boolean
    value_field: visible
    ttl_days: 365
    min_confidence: 0.5
    tools: [sunset_view]
    question: >-
      Какие номера выходят на запад? На каком они этаже и что видно из их окон —
      море, открытый горизонт или соседние здания?
    search:
      op: "=="
      hint: "вид на закат, западная сторона, закат из окна"

  noise_score:
    title: "Уровень шума"
    description: >-
      Оценка шума 0–100 по дорогам, железной дороге и ночным заведениям
      в радиусе 100–300 м. Чем меньше, тем тише.
    target: hotel
    value_type: number
    value_field: score
    ttl_days: 180
    min_confidence: 0.5
    tools: [noise_score]
    question: >-
      Есть ли в номерах шумоизоляция? Какие номера выходят на дорогу,
      а какие во двор?
    search:
      op: "<="
      hint: "тихий номер, тишина, чтобы не мешал шум, спокойный район"

  walk_to_sea:
    title: "Пешком до моря"
    description: >-
      Время пешего пути до пляжа по реальным дорогам OSM с учётом рельефа,
      а не по прямой. Отдельно отмечается переход через магистраль.
    target: hotel
    value_type: number
    value_field: minutes
    ttl_days: 365
    min_confidence: 0.5
    tools: [walk_to_sea]
    question: >-
      Сколько минут пешком от вас до пляжа и нужно ли переходить дорогу
      с интенсивным движением?
    search:
      op: "<="
      hint: "рядом с морем, близко к пляжу, пешком до моря"

  climate_summer:
    title: "Климат летом"
    description: >-
      Средний суточный максимум температуры в июле по историческим данным
      Open-Meteo за 2019–2024 годы.
    target: hotel
    value_type: number
    value_field: mean_july_max_c
    ttl_days: 30
    min_confidence: 0.7
    tools: [climate_summer]
    question: ""
    search:
      op: ">="
      hint: "тёплое море, тепло, купаться, жарко"

  pet_friendly:
    title: "Можно с питомцем"
    description: >-
      Пускают ли с животными и на каких условиях. Из открытых данных не
      выводится — узнаём только у отельера.
    target: hotel
    value_type: boolean
    value_field: allowed
    ttl_days: 180
    min_confidence: 0.5
    tools: []
    question: >-
      Пускаете ли вы гостей с животными? Каких животных и до какого веса,
      есть ли доплата?
    search:
      op: "=="
      hint: "с собакой, с питомцем, с кошкой"
