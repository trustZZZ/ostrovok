# =============================================================================
# Демо-стенд Routely: сайт за системным nginx.
#
# Схема:
#   клиент → nginx на хосте (:80/:443) → 127.0.0.1:8081 → контейнер frontend
#   → контейнер backend.
#
# Порт 8080 на хосте не используется вообще: фронтенд-контейнер слушает 8080
# только внутри своей сети, а наружу опубликован как 127.0.0.1:8081.
# Внутренний nginx контейнера сам проксирует /api на backend:8000 и уже
# отдаёт SSE без буферизации, поэтому снаружи достаточно одного апстрима.
#
# Установка (Debian/Ubuntu):
#   sudo cp routely-site.conf /etc/nginx/sites-available/routely.conf
#   sudo ln -s /etc/nginx/sites-available/routely.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# =============================================================================

upstream routely_app {
    server 127.0.0.1:8081;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;

    # ЗАМЕНИТЬ на реальное имя или IP сервера.
    # Подчёркивание "_" допустимо только как заглушка: сервер будет
    # отвечать на любой Host, включая чужие домены, направленные сюда.
    server_name demo.example.com;

    # Поиск и ответы отельера — килобайты. Лимит с запасом, но не «безлимит».
    client_max_body_size 10m;

    # Не афишируем версию nginx.
    server_tokens off;

    # Сжатие делает внешний nginx: внутренний контейнер его не настраивает.
    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml
        application/wasm;

    # ---- API: SSE-стрим шагов агента -------------------------------------
    # Отдельный location, потому что поток нельзя буферизовать ни на одном
    # уровне: иначе браузер получит весь ответ одним куском в конце.
    # UI сейчас берёт шаги из ответа /api/search, но эндпоинт рабочий, и
    # ломать его настройкой nginx не нужно.
    location /api/agent/ {
        proxy_pass http://routely_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---- API и health ----------------------------------------------------
    location /api/ {
        proxy_pass http://routely_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        # enrich/refresh запускаются в фоне и отвечают сразу, но поиск с
        # внешней LLM доходит до 20 с таймаута — 120 с с запасом.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Публичный health приложения: {"status":"ok",...}
    location = /health {
        proxy_pass http://routely_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        access_log off;
    }

    # ---- Статика ---------------------------------------------------------
    # Сборка Vite кладёт бандлы в /assets/ с хешем в имени, поэтому их можно
    # кэшировать надолго. Если в сборке префикс другой — блок просто не
    # сработает и запрос уйдёт в location / ниже.
    location /assets/ {
        proxy_pass http://routely_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;

        proxy_cache off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ---- SPA -------------------------------------------------------------
    # index.html не кэшируем: иначе после пересборки клиент останется на
    # старых ассетах, которых уже нет.
    location / {
        proxy_pass http://routely_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;

        add_header Cache-Control "no-store" always;
    }
}

# =============================================================================
# TLS. Если сертификат уже есть в другом server block — перенеси туда
# location-блоки из nginx/routely-locations.conf, этот файл не нужен.
#
# Если терминировать TLS здесь, раскомментируй блок ниже и выполни:
#   sudo certbot certonly --webroot -w /var/www/html -d demo.example.com
# (для webroot нужен отдаваемый challenge — обычно он уже настроен в nginx)
# =============================================================================
#
# server {
#     listen 443 ssl;
#     listen [::]:443 ssl;
#     http2 on;
#
#     server_name demo.example.com;
#
#     ssl_certificate     /etc/letsencrypt/live/demo.example.com/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/demo.example.com/privkey.pem;
#     ssl_protocols       TLSv1.2 TLSv1.3;
#     ssl_session_cache   shared:SSL:10m;
#
#     client_max_body_size 10m;
#     server_tokens off;
#
#     # ... сюда скопировать все location-блоки из server{listen 80} выше ...
# }
#
