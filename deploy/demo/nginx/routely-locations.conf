# =============================================================================
# Сниппет для СУЩЕСТВУЮЩЕГО server block.
#
# Нужен, когда на сервере уже есть сайт на этом домене/порту (или TLS
# настроен certbot-ом) и отдельный server{} заводить не хочется.
#
# Две части вставляются в разные места — не перепутать:
#   ЧАСТЬ 1 (upstream) → в контекст http{}, то есть в файл внутри
#                        /etc/nginx/conf.d/ или выше server{} в sites-enabled;
#   ЧАСТЬ 2 (location) → внутрь нужного server{}.
#
# После вставки: sudo nginx -t && sudo systemctl reload nginx
# =============================================================================


# -----------------------------------------------------------------------------
# ЧАСТЬ 1 → в http{}
# -----------------------------------------------------------------------------
upstream routely_app {
    server 127.0.0.1:8081;
    keepalive 16;
}


# -----------------------------------------------------------------------------
# ЧАСТЬ 2 → внутрь server{}
# -----------------------------------------------------------------------------

# SSE-поток шагов агента: буферизацию выключаем, иначе ответ придёт целиком
# в конце. UI сейчас читает шаги из /api/search, но эндпоинт рабочий.
location /api/agent/ {
    proxy_pass http://routely_app;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

location /api/ {
    proxy_pass http://routely_app;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
}

location = /health {
    proxy_pass http://routely_app;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    access_log off;
}

# SPA. index.html не кэшируем: после пересборки старые ассеты уже удалены.
location / {
    proxy_pass http://routely_app;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 60s;

    add_header Cache-Control "no-store" always;
}
