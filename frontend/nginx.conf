server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Healthcheck для контейнера: не зависит от бэкенда, поэтому статика.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    # Публичный healthcheck приложения (пробрасывается в FastAPI).
    location = /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE-стрим шагов агента (/api/agent/{thread_id}/stream)
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # В mime.types nginx нет расширения .mjs, поэтому по умолчанию файл уходит
    # как application/octet-stream, и браузер отказывается создавать из него
    # module worker (карта MapLibre падала с "Worker failed to load").
    location ~* \.mjs$ {
        default_type application/javascript;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
